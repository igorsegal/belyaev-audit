name: Belyaev Audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: gcc:14
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: |
          apt-get update
          apt-get install -y cmake python3
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel 2
